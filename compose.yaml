services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tinycompany
      POSTGRES_USER: tinycompany
      POSTGRES_PASSWORD: tinycompany
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinycompany -d tinycompany"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
